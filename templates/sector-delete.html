<!DOCTYPE html>
<html>
<head>
    <title>Delete Sector</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 50px;
        }

        .delete-container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .warning {
            color: #dc3545;
            font-size: 20px;
            margin-bottom: 25px;
        }

        button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel {
            display: inline-block;
            background: #6c757d;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="delete-container">

    <h1>Delete Sector</h1>

    <p class="warning">
        Are you sure you want to delete "{{ object.name }}"?
    </p>

    <form method="post" action="{% url 'sector_delete' object.id %}">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'sector_list' %}" class="cancel">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
