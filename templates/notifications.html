
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    /* Notifications Page */

    .notifications-page {
        min-height: calc(100vh - 70px);
        padding: 50px 20px;
        background: #f5f7fb;
    }

    .notifications-container {
        max-width: 850px;
        margin: 0 auto;
    }

    /* Header */

    .notifications-header {
        margin-bottom: 30px;
    }

    .notifications-header h1 {
        margin: 0 0 8px;
        font-size: 32px;
        color: #222;
    }

    .notifications-header p {
        margin: 0;
        color: #777;
        font-size: 15px;
    }

    /* Notification List */

    .notifications-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* Notification Card */

    .notification-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
        transition: 0.2s ease;
    }

    .notification-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        border-color: #d1d5db;
    }

    /* Notification Link */

    .notification-link {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 20px;
        text-decoration: none;
        color: inherit;
    }

    /* Icon */

    .notification-icon {
        width: 45px;
        height: 45px;
        min-width: 45px;
        border-radius: 50%;
        background: #eef2ff;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 20px;
    }

    /* Content */

    .notification-content {
        flex: 1;
    }

    .notification-message {
        margin: 0 0 7px;
        color: #252525;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.5;
    }

    .notification-date {
        color: #888;
        font-size: 12px;
    }

    /* Arrow */

    .notification-arrow {
        color: #999;
        font-size: 22px;
        transition: 0.2s ease;
    }

    .notification-card:hover .notification-arrow {
        transform: translateX(4px);
        color: #333;
    }

    /* Empty State */

    .empty-notifications {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 60px 30px;
        text-align: center;
    }

    .empty-icon {
        width: 65px;
        height: 65px;
        margin: 0 auto 20px;

        border-radius: 50%;
        background: #f1f3f5;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 28px;
    }

    .empty-notifications h3 {
        margin: 0 0 8px;
        font-size: 20px;
        color: #333;
    }

    .empty-notifications p {
        margin: 0 0 25px;
        color: #888;
        font-size: 14px;
    }

    /* Browse Jobs Button */

    .browse-jobs-btn {
        display: inline-block;
        padding: 11px 22px;
        background: #333;
        color: white;
        border-radius: 7px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: 0.2s ease;
    }

    .browse-jobs-btn:hover {
        background: #111;
    }

    /* Mobile */

    @media (max-width: 600px) {

        .notifications-page {
            padding: 30px 15px;
        }

        .notifications-header h1 {
            font-size: 26px;
        }

        .notification-link {
            padding: 15px;
            gap: 12px;
        }

        .notification-icon {
            width: 38px;
            height: 38px;
            min-width: 38px;
            font-size: 17px;
        }

        .notification-message {
            font-size: 14px;
        }

        .notification-arrow {
            display: none;
        }

        .empty-notifications {
            padding: 45px 20px;
        }
    }
</style>
</head>
<body>
    <div class="notifications-page">

    <div class="notifications-container">

        <!-- Notifications -->

        {% if notifications %}

            <div class="notifications-list">

                {% for notification in notifications %}

                    <div class="notification-card">

                        <a href="{% url 'mark_notification_read' notification.id %}"
                           class="notification-link">

                            <div class="notification-icon">
                                🔔
                            </div>

                            <div class="notification-content">

                                <p class="notification-message">
                                    {{ notification.message }}
                                </p>

                                <small class="notification-date">
                                    {{ notification.created_at }}
                                </small>

                            </div>
                            {% if not notification.is_read %}
                                <span class="new-badge" style="color: blue;">
                                    NEW
                                </span>
                            {% endif %}

                        </a>

                    </div>

                {% endfor %}

                <div>
                    <a href="{% url 'home' %}" class="browse-jobs-btn">
                    Home
                    </a>
                </div>

            </div>

        {% endif %}

    </div>

</div>
</body>
</html>
